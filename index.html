<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>امتحان تقييم Backend & Express - Easy Way Academy</title>
  <style>
    :root { --primary: #3498db; --success: #2ecc71; --danger: #e74c3c; --dark: #2c3e50; --bg: #f4f6f9; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--dark); margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
    .timer { background: #e74c3c; color: white; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 1.1rem; }
    .student-info { margin-bottom: 20px; display: flex; gap: 10px; }
    .student-info input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    .question-card { background: #fafbfc; border: 1px solid #e1e4e8; padding: 20px; border-radius: 8px; margin-bottom: 15px; }
    .question-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 12px; color: var(--dark); }
    .options label { display: block; background: white; border: 1px solid #d1d5db; padding: 10px 15px; border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; }
    .options label:hover { background: #f0f4f8; border-color: var(--primary); }
    .options input { margin-left: 10px; }
    .btn { background: var(--primary); color: white; border: none; padding: 12px 25px; font-size: 1.1rem; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    .btn:hover { background: #2980b9; }
    .hidden { display: none !important; }
    .result-box { text-align: center; padding: 30px; }
    .score-badge { font-size: 3rem; font-weight: bold; color: var(--success); margin: 15px 0; }
  </style>
</head>
<body>

<div class="container" id="appContainer">
  <header>
    <h2>🚀 امتحان تقييم مهارات الـ Backend</h2>
    <div id="timerDisplay" class="timer hidden">30:00</div>
  </header>

  <!-- شاشة إدخال بيانات الطالب -->
  <div id="loginScreen">
    <p>أهلاً بك يا بشمهندس. يرجى إدخال اسمك الثلاثي والتخصص لبدء الامتحان:</p>
    <div class="student-info">
      <input type="text" id="studentName" placeholder="الاسم الثلاثي">
      <input type="text" id="studentTrack" placeholder="التخصص (مثال: Node.js)">
    </div>
    <button class="btn" onclick="startExam()">بدء الامتحان الآن</button>
  </div>

  <!-- شاشة الأسئلة -->
  <div id="examScreen" class="hidden">
    <div id="questionsContainer"></div>
    <button class="btn" onclick="submitExam()">إجبار وتسليم الامتحان</button>
  </div>

  <!-- شاشة النتيجة -->
  <div id="resultScreen" class="hidden result-box">
    <h2>🎉 تم تسليم الامتحان بنجاح!</h2>
    <p>نتيجة تقييمك النهائي:</p>
    <div class="score-badge" id="finalScore">0 / 30</div>
    <p id="resultMessage" style="font-size: 1.2rem; font-weight: bold;"></p>
  </div>
</div>

<script>
  // -------------------------------------------------------------------------
  // قاعدة أسئلة الامتحان (الـ 30 سؤال). يمكن تغييرها بسهولة لأي امتحان قادم!
  // -------------------------------------------------------------------------
  const questions = [
    { q: "1. ما هي الوظيفة الأساسية لاستخدام Express.js فوق Node.js؟", options: ["تسريع أداء المعالج", "تسهيل بناء الـ APIs وإدارة المسارات (Routing)", "حذف الملفات التلقائية", "تصميم واجهات الـ Frontend"], correct: 1 },
    { q: "2. كيف يتم تشغيل سيرفر Express على بورت معين مثل 3000؟", options: ["app.run(3000)", "server.start(3000)", "app.listen(3000)", "node.listen(3000)"], correct: 2 },
    { q: "3. أي دالة تُستخدم لقراءة بيانات الـ JSON المرسلة في الـ Body بداخل الـ Express؟", options: ["app.use(express.json())", "app.parseJson()", "express.readBody()", "req.json()"], correct: 0 },
    { q: "4. أي نوع من طلبات HTTP يُستخدم لجلب أو قراءة البيانات (Read)؟", options: ["POST", "PUT", "DELETE", "GET"], correct: 3 },
    { q: "5. أي نوع من طلبات HTTP يُستخدم لإنشاء أو إضافة سجل جديد (Create)؟", options: ["GET", "POST", "PUT", "DELETE"], correct: 1 },
    { q: "6. أين يتم تخزين المتغيرات القادمة من مسار الرابط مثل /students/:id؟", options: ["req.body", "req.params", "req.query", "res.params"], correct: 1 },
    { q: "7. ما هو الكود المسؤول عن إرسال رد بصيغة JSON مع Status Code صحيح عند النجاح في الإنشاء؟", options: ["res.json(data)", "res.status(201).json(data)", "res.send(200)", "res.render(data)"], correct: 1 },
    { q: "8. ماذا يعني رمز الحالة (HTTP Status Code) رقم 404؟", options: ["تم الإنشاء بنجاح", "خطأ في السيرفر", "الصفحة أو العنصر غير موجود (Not Found)", "غير مسموح بالدخول"], correct: 2 },
    { q: "9. ما هو الكود المناسب للتعبير عن أن الطلب ناجح تماماً (OK)؟", options: ["200", "201", "400", "500"], correct: 0 },
    { q: "10. ما هي مكتبة Node.js المدمجة (Built-in) للتعامل مع مسارات الملفات ونظام التشغيل؟", options: ["express", "path", "axios", "nodemon"], correct: 1 },
    { q: "11. ما فائدة المتغير المدمج __dirname في Node.js؟", options: ["يعطي مسار الفولدر الحالي للمشروع", "يحذف الملفات المؤقتة", "يشغل السيرفر", "يحدد حجم الذاكرة"], correct: 0 },
    { q: "12. أي دالة من مصفوفات جافاسكريبت تُستخدم للبحث عن عنصر واحد بشرط محدد؟", options: ["filter()", "map()", "find()", "push()"], correct: 2 },
    { q: "13. أي دالة تُستخدم لإيجاد رقم الـ Index لعنصر داخل مصفوفة لتعديله أو حذفه؟", options: ["findIndex()", "search()", "locate()", "indexOfIndex()"], correct: 0 },
    { q: "14. كيف يتم حذف عنصر من مصفوفة في الذاكرة باستخدام الـ Index؟", options: ["students.delete(index)", "students.splice(index, 1)", "students.remove(index)", "students.popAll()"], correct: 1 },
    { q: "15. ماذا يفعل كود fs.readFileSync في Node.js؟", options: ["يكتب ملفاً جديداً", "يقرأ محتوى ملف بشكل متزامن (Synchronous)", "يحذف ملفاً نهائياً", "يفتح سيرفر ويب"], correct: 1 },
    { q: "16. لماذا نستخدم دالة parseInt() عند قراءة الـ ID من req.params.id؟", options: ["لأنه يصل كنص String ويجب تحويله لرقم Number للتحقق السليم", "لإلغاء الأخطاء البرمجية", "لزيادة سرعة السيرفر", "لأنها دالة إجبارية في Express"], correct: 0 },
    { q: "17. أي طلب HTTP يُستخدم لتعديل أو تحديث بيانات عنصر بالكامل (Update)؟", options: ["GET", "POST", "PUT", "PATCH"], correct: 2 },
    { q: "18. إذا أرسل المستخدم بيانات ناقصة في الـ POST، ما هو Status Code المناسب للرد (Bad Request)؟", options: ["200", "400", "404", "500"], correct: 1 },
    { q: "19. كيف نُرسل ملف HTML جاهز للعميل عبر مسار في Express؟", options: ["res.sendHtml()", "res.renderFile()", "res.sendFile(path.join(...))", "res.file()"], correct: 2 },
    { q: "20. ما هي الحزمة (Package) الشهيرة التي تُستخدم لإعادة تشغيل السيرفر تلقائياً عند حفظ الملفات أثناء التطوير؟", options: ["auto-run", "nodemon", "express-reload", "node-refresh"], correct: 1 },
    { q: "21. كيف يتم تثبيت حزمة خارجية مثل express في المشروع عبر الـ Terminal؟", options: ["node install express", "npm add-package express", "npm install express", "get express"], correct: 2 },
    { q: "22. ما هو اسم الملف الأساسي الذي ينشئه أمر `npm init` لحفظ إعدادات وتبعيات المشروع؟", options: ["config.json", "package.json", "settings.js", "index.json"], correct: 1 },
    { q: "23. في هندسة برمجيات الـ REST API، ماذا تعني كلمة REST اختصاراً؟", options: ["Remote System Transfer", "Representational State Transfer", "Request Server Technology", "Rapid Express Service Type"], correct: 1 },
    { q: "24. أي كود يعبر عن استخدام دالة الـ Middleware الخاصة بـ Express لتقسيم الكود؟", options: ["app.use()", "app.call()", "app.middleware()", "app.router()"], correct: 0 },
    { q: "25. كيف نتحقق من أن مصفوفة الطلاب تحتوي على عناصر قبل جلب العنصر الأخير لتوليد ID جديد؟", options: ["students.length > 0", "students.exists()", "students.count > 0", "students.check()"], correct: 0 },
    { q: "26. ما هو الخطأ الناتج غالباً إذا نسينا كتابة `app.use(express.json())` وحاولنا قراءة `req.body`؟", options: ["ReferenceError", "TypeError: Cannot read properties of undefined (reading 'name')", "SyntaxError: JSON parse failed", "404 Not Found"], correct: 1 },
    { q: "27. ما هي البيئة أو المحرك الذي يتيح تشغيل كود JavaScript خارج المتصفح (على السيرفر)؟", options: ["React", "Node.js", "V8 Engine directly without runtime", "HTML5"], correct: 1 },
    { q: "28. ماذا تفعل دالة JSON.stringify() في الجافاسكريبت؟", options: ["تحول نص JSON إلى كود برمجي", "تحول كائن Object أو مصفوفة إلى نص String بصيغة JSON", "تقرأ ملف من الهارد ديسك", "تتحقق من صحة المدخلات"], correct: 1 },
    { q: "29. أي دالة من حزمة fs تقوم بكتابة البيانات وحفظها داخل ملف JSON على الهارد ديسك؟", options: ["fs.writeJson()", "fs.writeFileSync()", "fs.saveFile()", "fs.out()"], correct: 1 },
    { q: "30. ما هو الكود الصحيح لإنشاء متغير سيرفر Express في بداية ملف الكود؟", options: ["const app = express();", "const app = new Express();", "const server = express.server();", "const app = express.createServer();"], correct: 0 }
  ];

  let timerInterval;
  let timeLeft = 30 * 60; // 30 دقيقة بالثواني

  // التحقق مما إذا كان الطالب قد امتحن مسبقاً عند فتح الصفحة
  window.onload = function() {
    if (localStorage.getItem('easyWayExamSubmitted')) {
      document.getElementById('appContainer').innerHTML = `
        <div class="result-box">
          <h2>🚫 عذراً يا بشمهندس</h2>
          <p style="font-size: 1.2rem; margin-top: 15px;">لقد قمت بأداء هذا الامتحان مسبقاً من هذا المتصفح ولا يمكنك إعادة إرساله مرة أخرى.</p>
          <div class="score-badge">محاولة مسجلة</div>
        </div>
      `;
    }
  };

  function startExam() {
    const name = document.getElementById('studentName').value.trim();
    const track = document.getElementById('studentTrack').value.trim();

    if (!name || !track) {
      alert('الرجاء إدخال الاسم والتخصص أولاً!');
      return;
    }

    // حفظ بيانات الطالب مؤقتاً
    localStorage.setItem('studentName', name);
    localStorage.setItem('studentTrack', track);

    // إخفاء شاشة التسجيل وإظهار الأسئلة والعداد
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('examScreen').classList.remove('hidden');
    document.getElementById('timerDisplay').classList.remove('hidden');

    renderQuestions();
    startTimer();
  }

  function renderQuestions() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    questions.forEach((item, index) => {
      let optionsHtml = '';
      item.options.forEach((opt, optIndex) => {
        optionsHtml += `
          <label>
            <input type="radio" name="q_${index}" value="${optIndex}">
            ${opt}
          </label>
        `;
      });

      container.innerHTML += `
        <div class="question-card">
          <div class="question-title">${item.q}</div>
          <div class="options">${optionsHtml}</div>
        </div>
      `;
    });
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        alert('انتهى وقت الامتحان المخصص (30 دقيقة)! سيتم تسليم الإجابات تلقائياً.');
        submitExam();
        return;
      }
      timeLeft--;
      let minutes = Math.floor(timeLeft / 60);
      let seconds = timeLeft % 60;
      document.getElementById('timerDisplay').innerText = 
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }, 1000);
  }

  function submitExam() {
    clearInterval(timerInterval);
    
    let score = 0;
    questions.forEach((item, index) => {
      const selectedOption = document.querySelector(`input[name="q_${index}"]:checked`);
      if (selectedOption && parseInt(selectedOption.value) === item.correct) {
        score++;
      }
    });

    // قفل الامتحان ومنع إعادة فتحه نهائياً عبر LocalStorage
    localStorage.setItem('easyWayExamSubmitted', 'true');
    localStorage.setItem('easyWayExamScore', score);

    // عرض النتيجة
    document.getElementById('examScreen').classList.add('hidden');
    document.getElementById('timerDisplay').classList.add('hidden');
    document.getElementById('resultScreen').classList.remove('hidden');
    document.getElementById('finalScore').innerText = `${score} / 30`;

    let msg = "";
    if (score >= 25) msg = "ممتاز جداً! أداء مبهر وراقي يا باشمهندس 🌟";
    else if (score >= 18) msg = "جيد جداً، لديك خلفية قوية وتستحق التقدير 👍";
    else msg = "تحتاج لمراجعة بسيطة على بعض تفاصيل الـ CRUD والـ Express 💪";
    
    document.getElementById('resultMessage').innerText = msg;
  }
</script>

</body>
</html>
